<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Decide before the first paint; the loading cover and React share this flag.
      (function () {
        var root = document.documentElement;
        var host = window.location.hostname;
        var preview = /^\/index-(v[23])\.html$/.exec(window.location.pathname);
        var versionsByHost = {
          "hwajinyu.silee.net": "v1",
          "hwajinyu2.silee.net": "v2",
          "hwajinyu22.silee.net": "v3"
        };
        root.dataset.weddingVersion = preview
          ? preview[1]
          : versionsByHost[host] || root.dataset.weddingVersion || "v1";
      })();
    </script>
    <script>
      window.weddingAudio = new Audio("%BASE_URL%music/wedding.mp3");
      window.weddingAudio.volume = 0.6;
      window.weddingAudio.loop = true;
      window.weddingAudio.preload = "auto";
      if (!/\/(?:invite|wedding)\/?$/.test(window.location.pathname)) {
        window.weddingAudio.play().catch(function () {
          // The music control retries playback when the user interacts.
        });
      }
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="preload"
      as="image"
      href="/src/assets/img/last/preview/img_13.webp"
      fetchpriority="high"
      type="image/webp"
    />
    <link
      rel="preload"
      as="image"
      href="/src/assets/img/last/preview/img_22.webp"
      fetchpriority="high"
      type="image/webp"
    />
    <style>
      @media (hover: hover) and (pointer: fine) {
        html {
          scrollbar-gutter: stable both-edges;
        }
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #ecebe8;
      }

      html[data-wedding-version="v2"],
      html[data-wedding-version="v3"] {
        --wedding-hero-image: url("/hero-v2-img7.webp");
      }

      #initial-cover {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: none;
        justify-content: center;
        background: #ecebe8;
        opacity: 1;
        transition: opacity 520ms ease;
        pointer-events: none;
      }

      #initial-cover.is-active {
        display: flex;
      }

      #initial-cover.is-hidden {
        opacity: 0;
      }

      #initial-cover .initial-cover-frame {
        position: relative;
        width: 100%;
        max-width: 430px;
        min-height: 100svh;
        overflow: hidden;
        background: #333;
      }

      #initial-cover .initial-cover-frame::before {
        content: "";
        position: absolute;
        inset: -12px;
        background: var(--wedding-hero-image, url("/src/assets/img/last/preview/img_13.webp")) center / cover no-repeat;
        filter: blur(3px) brightness(0.58);
        transform: scale(1.035);
      }

      #initial-cover .initial-cover-frame::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(20, 20, 20, 0.12);
      }

      #initial-cover .initial-cover-mark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 28px;
        height: 18px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 3px;
        transform: translate(-50%, -50%);
        z-index: 1;
      }

      #initial-cover .initial-cover-mark span {
        width: 4px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        animation: initial-cover-wave 880ms ease-in-out infinite;
      }

      #initial-cover .initial-cover-mark span:nth-child(2) {
        animation-delay: 140ms;
      }

      #initial-cover .initial-cover-mark span:nth-child(3) {
        animation-delay: 280ms;
      }

      @keyframes initial-cover-wave {
        0%,
        100% {
          height: 5px;
          opacity: 0.55;
        }

        50% {
          height: 17px;
          opacity: 1;
        }
      }
    </style>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hwajinyu.silee.net/" />
    <meta property="og:site_name" content="세인 &amp; 화진 결혼합니다" />

    <meta name="twitter:title" content="세인 🖤 화진 결혼합니다" />

    <title>세인 🖤 화진 결혼합니다</title>
  </head>
  <body>
    <div id="initial-cover" aria-hidden="true">
      <div class="initial-cover-frame">
        <div class="initial-cover-mark">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var cover = document.getElementById("initial-cover");
        if (!cover) return;

        function canShowInitialCover() {
          try {
            var navigationEntry = performance.getEntriesByType("navigation")[0];
            var isReload =
              navigationEntry && navigationEntry.type === "reload";

            return !isReload && window.scrollY <= 5;
          } catch (error) {
            return window.scrollY <= 5;
          }
        }

        if (canShowInitialCover()) {
          cover.classList.add("is-active");
        } else {
          cover.remove();
        }
      })();

      window.setTimeout(function () {
        var cover = document.getElementById("initial-cover");
        if (!cover) return;
        cover.classList.add("is-hidden");
        window.setTimeout(function () {
          cover.remove();
        }, 560);
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
